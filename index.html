<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dynamic JavaScript DOM and REST API client demo">
  <title>Product Explorer</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">ES6+ REST API CLIENT</p>
      <h1>Product Explorer</h1>
      <p class="subtitle">Live products, client-side filtering, sorting and persistent cart state.</p>
    </div>
    <button id="cart-button" class="cart-button" type="button" aria-label="Open cart">
      Cart <span id="cart-count" class="badge">0</span>
    </button>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Product controls">
      <label class="search">
        <span class="sr-only">Search products</span>
        <input id="search-input" type="search" placeholder="Search products..." autocomplete="off">
      </label>
      <div id="category-tabs" class="tabs" role="tablist" aria-label="Product categories"></div>
      <label class="sort">
        <span class="sr-only">Sort products</span>
        <select id="sort-select">
          <option value="default">Sort: Default</option>
          <option value="price-asc">Price: Low to high</option>
          <option value="price-desc">Price: High to low</option>
          <option value="rating-desc">Rating: High to low</option>
          <option value="title-asc">Name: A to Z</option>
        </select>
      </label>
    </section>

    <div id="error-banner" class="banner error hidden" role="alert"></div>
    <div id="loading" class="skeleton-grid" aria-live="polite" aria-label="Loading products">
      <div class="skeleton-card"></div><div class="skeleton-card"></div>
      <div class="skeleton-card"></div><div class="skeleton-card"></div>
      <div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>

    <section id="product-grid" class="product-grid" aria-live="polite"></section>
    <p id="empty-state" class="empty hidden">No products match your filters.</p>
  </main>

  <aside id="cart-panel" class="cart-panel" aria-label="Shopping cart" aria-hidden="true">
    <div class="cart-header">
      <h2>Your cart</h2>
      <button id="close-cart" class="icon-button" type="button" aria-label="Close cart">×</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <strong>Total: $<span id="cart-total">0.00</span></strong>
      <button id="clear-cart" class="secondary-button" type="button">Clear cart</button>
    </div>
  </aside>
  <div id="cart-backdrop" class="backdrop hidden"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
